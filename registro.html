<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EL 10 WEB | Registro</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo"><h1>EL 10 WEB</h1></div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="trayectoria.html">Mi Trayectoria</a></li>
                <li><a href="articulos.html">Artículos</a></li>
                <li><a href="registro.html" class="active">Registro</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-section form-section">
            <h2>Regístrate</h2>
            <form id="registroForm" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required />
                </div>
                <button type="submit" class="btn">Registrarse</button>
            </form>
            <p class="login-link">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EL 10 WEB - Todos los derechos reservados.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
